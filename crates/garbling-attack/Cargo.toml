[package]
name = "garbling-attack"
version = "0.1.0"
edition = "2021"
description = "Working proof-of-concept for the attacks on garbler-binding in BitVM3-core. Faithful ZRE15 half-gates + free-XOR, parameterized by label length."
license = "MIT"

[dependencies]
blake3 = "1.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
